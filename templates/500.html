{% extends "base.html" %}
{% block title %}Server Error (500) | Smart PHC{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="stat-icon danger mx-auto mb-3" style="width: 64px; height: 64px;">
      <i class="bi bi-exclamation-triangle-fill fs-2"></i>
    </div>
    <h1 class="h3 fw-bold text-dark">500 — Internal Processing Error</h1>
    <p class="text-muted">An unexpected error occurred during database transaction processing. The operation was safely rolled back.</p>
    <div class="d-flex justify-content-center gap-2 mt-4">
      <a href="{{ url_for('landing') }}" class="btn btn-phc-primary">Return to Home</a>
    </div>
  </div>
</div>
{% endblock %}
