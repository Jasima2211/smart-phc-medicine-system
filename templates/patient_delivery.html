{% extends "base.html" %}

{% block title %}Request Medicine Delivery — Smart PHC{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7 col-md-9">
    <div class="page-header">
      <h1>Request Medicine Delivery</h1>
      <p>Submit a medicine delivery request to your Primary Health Centre.</p>
    </div>

    <div class="card card-phc shadow-sm">
      <div class="card-body p-4">
        <form action="{{ url_for('patient_delivery') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="phc_id" class="form-label small fw-semibold">Primary Health Centre</label>
              <select class="form-select" id="phc_id" name="phc_id" required>
                <option value="">Select Health Centre...</option>
                {% for p in all_phcs %}
                  <option value="{{ p.id }}" {% if selected_phc_id == p.id %}selected{% endif %}>
                    {{ p.name }} ({{ p.location }})
                  </option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label for="medicine_id" class="form-label small fw-semibold">Medicine</label>
              <select class="form-select" id="medicine_id" name="medicine_id" required>
                <option value="">Select Medicine...</option>
                {% for m in all_medicines %}
                  <option value="{{ m.id }}" {% if selected_med_id == m.id %}selected{% endif %}>
                    {{ m.name }} ({{ m.dosage_form or m.unit }})
                  </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label for="quantity" class="form-label small fw-semibold">Quantity</label>
              <input type="number" class="form-control" id="quantity" name="quantity" min="1" max="1000" value="10" required>
            </div>

            <div class="col-md-8">
              <label for="patient_name" class="form-label small fw-semibold">Patient Name</label>
              <input type="text" class="form-control" id="patient_name" name="patient_name" value="{{ default_patient_name or '' }}" placeholder="Patient Name" required>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="contact_phone" class="form-label small fw-semibold">Contact Phone</label>
              <input type="tel" class="form-control" id="contact_phone" name="contact_phone" value="{{ default_phone or '' }}" placeholder="Contact Phone" required>
            </div>

            <div class="col-md-6">
              <label for="delivery_address" class="form-label small fw-semibold">Delivery Address</label>
              <textarea class="form-control" id="delivery_address" name="delivery_address" rows="2" placeholder="Delivery Address" required>{{ default_address or '' }}</textarea>
            </div>
          </div>

          <div class="mb-4">
            <label for="notes" class="form-label small fw-semibold">Notes (Optional)</label>
            <textarea class="form-control" id="notes" name="notes" rows="2" placeholder="Prescription details or delivery instructions..."></textarea>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('patient_search') }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
            <button type="submit" class="btn btn-phc-primary px-4 fw-semibold">Submit Order</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
