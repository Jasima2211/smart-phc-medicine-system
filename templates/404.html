{% extends "base.html" %}
{% block title %}Page Not Found (404) | Smart PHC{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="stat-icon warning mx-auto mb-3" style="width: 64px; height: 64px;">
      <i class="bi bi-question-circle fs-2"></i>
    </div>
    <h1 class="h3 fw-bold text-dark">404 — Record or Route Not Found</h1>
    <p class="text-muted">The requested health centre, inventory record, or page could not be located in the system database.</p>
    <div class="d-flex justify-content-center gap-2 mt-4">
      <a href="{{ url_for('landing') }}" class="btn btn-phc-primary">Return to Home</a>
      <a href="{{ url_for('patient_search') }}" class="btn btn-outline-secondary">Medicine Search</a>
    </div>
  </div>
</div>
{% endblock %}
